# Local development profile: SPRING_PROFILES_ACTIVE=dev ./mvnw spring-boot:run

# H2 Console at /h2-console, reachable from localhost only
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Throwaway signing key so the app starts without extra setup. Never reuse it elsewhere.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-do-not-use-in-prod}

# Passwordless login (POST /api/auth/dev-login) and "mock-google:<email>:<name>" tokens
app.auth.dev-login.enabled=true
app.auth.mock-google-tokens.enabled=true

# Local frontends such as Expo web (http://localhost:8081)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

spring.application.name=housesit

# Secure-by-default baseline. Local development conveniences (H2 console,
# dev login, mock Google tokens, demo data) live in application-dev.properties
# and are enabled with SPRING_PROFILES_ACTIVE=dev.

# Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:housesitdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (only enabled in the dev profile)
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
# HMAC-SHA key, at least 32 bytes. Required: the app refuses to start without it.
# Generate one with: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google OAuth2 Client ID. Google ID tokens are rejected unless their audience matches it.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Development-only authentication shortcuts (never enable in production)
app.auth.dev-login.enabled=false
app.auth.mock-google-tokens.enabled=false

# CORS: comma-separated list of allowed origins (patterns allowed, e.g. https://*.example.com).
# Empty means same-origin only; the bundled web UI is served by this app and needs no CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
